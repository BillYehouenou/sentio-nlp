<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sentio - Chargement</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body data-page="app">

  <main class="app-screen">
    <div class="container" style="text-align: center;">

      <div data-form-wrap>
        <div class="url-bar" style="max-width: 560px; margin: 0 auto;">
          <form data-analyze-form novalidate style="display: contents;">
            <input
              type="text"
              inputmode="url"
              autocomplete="off"
              placeholder="https://www.youtube.com/watch?v=..."
              aria-label="URL de la vidéo YouTube à analyser"
            />
            <button class="btn btn--brand" type="submit">
              <span class="btn__label">Analyser</span>
              <span class="btn__spinner" aria-hidden="true"></span>
            </button>
          </form>
        </div>

        <p class="banner banner--error" data-error-banner role="alert" style="max-width: 560px; margin: 16px auto 0;"></p>
      </div>

      <div class="loading-screen" data-loading-screen hidden>
        <p class="loading-screen__step-counter mono">Étape <span data-step-current>1</span> / 3</p>

        <div class="loading-ring">
          <svg class="loading-ring__svg" viewBox="0 0 160 160" aria-hidden="true">
            <circle class="loading-ring__arc" data-arc="0" cx="80" cy="80" r="70" transform="rotate(-85 80 80)" />
            <circle class="loading-ring__arc" data-arc="1" cx="80" cy="80" r="70" transform="rotate(35 80 80)" />
            <circle class="loading-ring__arc" data-arc="2" cx="80" cy="80" r="70" transform="rotate(155 80 80)" />
          </svg>
          <div class="loading-ring__icon">
            <svg class="loading-ring__icon-svg is-visible" data-icon="document" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="5" y="3" width="14" height="18" rx="2" /><path d="M8 8h8M8 12h8M8 16h5" />
            </svg>
            <svg class="loading-ring__icon-svg" data-icon="chip" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="7" y="7" width="10" height="10" rx="1.5" /><path d="M9 3v3M15 3v3M9 18v3M15 18v3M3 9h3M3 15h3M18 9h3M18 15h3" />
            </svg>
            <svg class="loading-ring__icon-svg" data-icon="chart" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M4 19h16M7 19v-6M12 19v-10M17 19v-4" />
            </svg>
            <svg class="loading-ring__icon-svg" data-icon="check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M5 13l5 5L20 7" />
            </svg>
          </div>
        </div>

        <h2 class="loading-screen__title" data-step-title>Récupération des commentaires</h2>

        <ul class="loading-checklist" data-checklist>
          <li class="loading-checklist__item">
            <span class="loading-checklist__dot" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7" /></svg>
            </span>
            Récupérer les commentaires
          </li>
          <li class="loading-checklist__item">
            <span class="loading-checklist__dot" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7" /></svg>
            </span>
            Classer chaque commentaire
          </li>
          <li class="loading-checklist__item">
            <span class="loading-checklist__dot" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7" /></svg>
            </span>
            Construire les graphiques
          </li>
        </ul>

        <p class="loading-screen__video" data-loading-video></p>
      </div>

    </div>
  </main>

  <script src="script.js" defer></script>
</body>
</html>
