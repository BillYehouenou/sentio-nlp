[project]
name = "sentio"
version = "0.1.0"
description = "Analyse de sentiment des commentaires YouTube, servie via FastAPI et ONNX."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "google-api-python-client>=2.130",
    "onnxruntime>=1.18",
    "transformers>=4.41",
    "numpy>=1.26",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]

export = [
    "optimum>=2.0",
    "optimum-onnx>=0.1.0",
    "torch>=2.2",
    "sentencepiece>=0.2",
    "onnx>=1.16",  # graph manipulation for int8 quantization (onnxruntime.quantization)
]

[tool.uv]
package = false
